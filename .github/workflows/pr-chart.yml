name: Update PR Pie Chart

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_pr_chart.py"

permissions:
  contents: write

jobs:
  build-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate PR pie chart + stats card
        env:
          GH_USERNAME: VedWay
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: assets/pr-chart.svg
          STATS_OUTPUT_PATH: assets/stats-card.svg
        run: python scripts/generate_pr_chart.py

      - name: Commit updated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/pr-chart.svg assets/stats-card.svg
          git diff --staged --quiet || git commit -m "chore: update GitHub stat cards [skip ci]"
          git push
